<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50">
  <defs>
    <linearGradient id="greenOrangeMain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#28a745;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#28a745;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#20c997;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#fd7e14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fd7e14;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Trade/Exchange circular arrows icon -->
  <g transform="translate(5, 5)">
    <!-- Outer circle made of small arrows pointing clockwise -->
    <!-- Top section - arrows pointing right -->
    <polygon points="8,4 12,2 12,6" fill="#28a745" />
    <polygon points="16,2 20,0 20,4" fill="#28a745" />
    <polygon points="24,2 28,0 28,4" fill="#20c997" />
    
    <!-- Right section - arrows pointing down -->
    <polygon points="34,8 36,12 32,12" fill="#20c997" />
    <polygon points="36,16 38,20 34,20" fill="#fd7e14" />
    <polygon points="36,24 38,28 34,28" fill="#fd7e14" />
    
    <!-- Bottom section - arrows pointing left -->
    <polygon points="28,36 24,38 24,34" fill="#fd7e14" />
    <polygon points="20,38 16,40 16,36" fill="#fd7e14" />
    <polygon points="12,36 8,38 8,34" fill="#20c997" />
    
    <!-- Left section - arrows pointing up -->
    <polygon points="2,28 0,24 4,24" fill="#20c997" />
    <polygon points="0,20 -2,16 2,16" fill="#28a745" />
    <polygon points="2,12 0,8 4,8" fill="#28a745" />
    
    <!-- Central bidirectional trade arrows -->
    <!-- Right-pointing arrow (green) -->
    <path d="M10,16 L18,12 L18,14 L28,14 L28,18 L18,18 L18,20 Z" fill="#28a745" />
    <!-- Left-pointing arrow (orange) -->
    <path d="M28,24 L20,28 L20,26 L10,26 L10,22 L20,22 L20,20 Z" fill="#fd7e14" />
    
    <!-- Connecting lines from outer arrows to center -->
    <line x1="12" y1="6" x2="14" y2="13" stroke="#28a745" stroke-width="1" opacity="0.6" />
    <line x1="34" y1="12" x2="28" y2="15" stroke="#20c997" stroke-width="1" opacity="0.6" />
    <line x1="34" y1="28" x2="28" y2="25" stroke="#fd7e14" stroke-width="1" opacity="0.6" />
    <line x1="4" y1="28" x2="10" y2="25" stroke="#20c997" stroke-width="1" opacity="0.6" />
  </g>
  
  <!-- Tradoja text - 'd' is the fade transition point -->
  <text x="52" y="35" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#greenOrangeMain)">
    Tradoja
  </text>
</svg>