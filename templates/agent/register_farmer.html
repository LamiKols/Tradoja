{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">
                        <i class="fas fa-user-plus me-2"></i>Register Farmer
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Farmer Name *</label>
                                <input type="text" name="name" class="form-control" required 
                                       placeholder="Full name">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Phone Number *</label>
                                <input type="tel" name="phone" class="form-control" required
                                       placeholder="08012345678 or +234...">
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Location</label>
                                <div class="input-group">
                                    <input type="text" name="location" id="location" class="form-control"
                                           placeholder="Town, State">
                                    <button type="button" class="btn btn-outline-primary" id="captureGpsBtn"
                                            title="Capture GPS location from your device">
                                        <i class="fas fa-map-marker-alt"></i>
                                    </button>
                                </div>
                                <small class="text-muted" id="gpsStatus"></small>
                                <input type="hidden" name="gps_lat" id="gps_lat">
                                <input type="hidden" name="gps_lng" id="gps_lng">
                                <input type="hidden" name="gps_accuracy" id="gps_accuracy">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Main Crop</label>
                                <input type="text" name="main_crop" class="form-control"
                                       placeholder="e.g., Rice, Yam, Tomatoes">
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Preferred Language</label>
                                <select name="language" class="form-select">
                                    {% for code, name in languages %}
                                    <option value="{{ code }}">{{ name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Registration Channel</label>
                                <select name="channel" class="form-select">
                                    {% for code, name in channels %}
                                    <option value="{{ code }}">{{ name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle me-2"></i>
                            A welcome SMS will be sent to the farmer with their registration details.
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('agent_dashboard') }}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left me-1"></i>Back
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-check me-1"></i>Register Farmer
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const captureBtn = document.getElementById('captureGpsBtn');
    const gpsStatus = document.getElementById('gpsStatus');
    const locationInput = document.getElementById('location');
    const gpsLat = document.getElementById('gps_lat');
    const gpsLng = document.getElementById('gps_lng');
    const gpsAccuracy = document.getElementById('gps_accuracy');
    
    if (captureBtn) {
        captureBtn.addEventListener('click', function() {
            if (!navigator.geolocation) {
                gpsStatus.innerHTML = '<span class="text-danger">GPS not supported on this device</span>';
                return;
            }
            
            captureBtn.disabled = true;
            captureBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            gpsStatus.innerHTML = '<span class="text-info">Getting location...</span>';
            
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;
                    
                    gpsLat.value = lat;
                    gpsLng.value = lng;
                    gpsAccuracy.value = accuracy;
                    
                    captureBtn.disabled = false;
                    captureBtn.innerHTML = '<i class="fas fa-check text-success"></i>';
                    gpsStatus.innerHTML = '<span class="text-success">GPS captured! Accuracy: ' + Math.round(accuracy) + 'm</span>';
                    
                    if (!locationInput.value) {
                        fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng)
                            .then(response => response.json())
                            .then(data => {
                                if (data.address) {
                                    const city = data.address.city || data.address.town || data.address.village || '';
                                    const state = data.address.state || '';
                                    if (city || state) {
                                        locationInput.value = city + (city && state ? ', ' : '') + state;
                                    }
                                }
                            })
                            .catch(err => console.log('Geocoding error:', err));
                    }
                },
                function(error) {
                    captureBtn.disabled = false;
                    captureBtn.innerHTML = '<i class="fas fa-map-marker-alt"></i>';
                    
                    let errorMsg = 'Unable to get location';
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg = 'Location permission denied';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg = 'Location unavailable';
                            break;
                        case error.TIMEOUT:
                            errorMsg = 'Location request timed out';
                            break;
                    }
                    gpsStatus.innerHTML = '<span class="text-danger">' + errorMsg + '</span>';
                },
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 60000
                }
            );
        });
    }
});
</script>
{% endblock %}
