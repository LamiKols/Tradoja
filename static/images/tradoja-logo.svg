<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" width="220" height="50">
  <defs>
    <linearGradient id="greenOrangeMain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#28a745;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#28a745;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#20c997;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#fd7e14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fd7e14;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Simple phone with trade arrows -->
  <g transform="translate(8, 3)">
    <!-- Phone outline -->
    <rect x="5" y="0" width="22" height="40" rx="3" ry="3" fill="none" stroke="#28a745" stroke-width="2.5"/>
    <!-- Phone screen -->
    <rect x="8" y="5" width="16" height="26" rx="1" fill="none" stroke="#20c997" stroke-width="1"/>
    <!-- Phone button -->
    <circle cx="16" cy="36" r="2" fill="#fd7e14"/>
    
    <!-- Trade arrows on screen - simple exchange -->
    <path d="M11,14 L21,14" stroke="#28a745" stroke-width="2" stroke-linecap="round"/>
    <polygon points="19,11 23,14 19,17" fill="#28a745"/>
    
    <path d="M21,22 L11,22" stroke="#fd7e14" stroke-width="2" stroke-linecap="round"/>
    <polygon points="13,19 9,22 13,25" fill="#fd7e14"/>
  </g>
  
  <!-- Tradoja text - 'd' is the fade transition point -->
  <text x="48" y="35" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="url(#greenOrangeMain)">
    Tradoja
  </text>
</svg>