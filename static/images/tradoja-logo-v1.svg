<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" width="220" height="50">
  <defs>
    <linearGradient id="textGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#28a745" />
      <stop offset="40%" style="stop-color:#28a745" />
      <stop offset="50%" style="stop-color:#20c997" />
      <stop offset="60%" style="stop-color:#fd7e14" />
      <stop offset="100%" style="stop-color:#fd7e14" />
    </linearGradient>
  </defs>
  
  <!-- Option 1: Two chat bubbles facing each other (trade conversation) -->
  <g transform="translate(5, 5)">
    <!-- Left bubble (green - seller) -->
    <path d="M2,8 Q2,2 10,2 L22,2 Q28,2 28,8 L28,18 Q28,24 22,24 L12,24 L6,30 L6,24 Q2,24 2,18 Z" 
          fill="#28a745"/>
    <circle cx="10" cy="13" r="2" fill="white"/>
    <circle cx="15" cy="13" r="2" fill="white"/>
    <circle cx="20" cy="13" r="2" fill="white"/>
    
    <!-- Right bubble (orange - buyer) -->
    <path d="M32,14 Q32,8 38,8 L50,8 Q56,8 56,14 L56,24 Q56,30 50,30 L40,30 L34,36 L34,30 Q32,30 32,24 Z" 
          fill="#fd7e14"/>
    <circle cx="40" cy="19" r="2" fill="white"/>
    <circle cx="45" cy="19" r="2" fill="white"/>
    <circle cx="50" cy="19" r="2" fill="white"/>
  </g>
  
  <!-- Tradoja text - Inter/modern sans-serif style -->
  <text x="68" y="34" font-family="Inter, Segoe UI, sans-serif" font-size="26" font-weight="600" letter-spacing="0.5" fill="url(#textGrad1)">
    Tradoja
